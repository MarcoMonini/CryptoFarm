[project]
name = "cryptofarm"
version = "0.1.0"
description = "Crypto trading simulator, live Binance bot, and LSTM-based signal model."
readme = "README.md"
requires-python = ">=3.12"
# Il nucleo: store delle candele, feature, etichette, modelli gbdt, bot live.
# Basta a far girare `cryptofarm.ml.trainer`, `cryptofarm.data.klines` e `scripts.analysis`.
dependencies = [
    "numpy==2.1.3",
    "pandas==2.3.1",
    "pyarrow==21.0.0",
    "scipy==1.16.0",
    "ta==0.11.0",
    "requests==2.32.4",
    "python-binance==1.0.29",
    "scikit-learn==1.7.1",
    "colorama==0.4.6",
]

[project.optional-dependencies]
# La pagina Streamlit (`trading/simulator.py`) e i moduli che decora con `st.cache_data`.
app = [
    "streamlit==1.47.1",
    "plotly==6.2.0",
]
# Solo per `--model gru|cnn|lstm`: `ml/models.py` importa keras dentro le funzioni, non in
# testa al modulo, quindi il default `gbdt` gira senza. Circa 1 GB installato.
dl = [
    "tensorflow==2.19.0",
    "keras-tuner==1.4.7",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.3",
    "black==26.5.1",
    "pre-commit==4.6.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = "backup/"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["backup"]

[tool.ruff.lint]
select = ["E", "F", "I"]
