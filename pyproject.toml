[project]
name = "cryptofarm"
version = "0.1.0"
description = "Crypto trading simulator, live Binance bot, and LSTM-based signal model."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.3.1",
    "scipy==1.16.0",
    "ta==0.11.0",
    "streamlit==1.47.1",
    "plotly==6.2.0",
    "python-binance==1.0.29",
    "tensorflow==2.19.0",
    "scikit-learn==1.7.1",
    "keras-tuner==1.4.7",
    "colorama==0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.3",
    "black==26.5.1",
    "pre-commit==4.6.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = "backup/"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["backup"]

[tool.ruff.lint]
select = ["E", "F", "I"]
