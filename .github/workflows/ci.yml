# Cosa deve essere vero prima di un merge: il codice e' formattato, passa il linter, i
# test passano su Python 3.12, e le immagini si costruiscono davvero.
#
# `quality` gira senza Docker (e' piu' veloce e i log sono leggibili); `docker` costruisce
# i target e fa girare i test dentro l'immagine, che e' l'unico modo di accorgersi che il
# Dockerfile si e' rotto. Nessun push di immagini: quello arriva quando c'e' un posto dove
# spedirle.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push che arriva mentre la CI del precedente e' in corso la annulla: sullo stesso ramo
# conta solo l'ultimo commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format e test (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installa il pacchetto
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[app,data,dev]"

      - name: ruff
        run: ruff check src tests scripts docker

      - name: black
        run: black --check src tests scripts docker

      # I test non toccano la rete ne' lo store delle candele: sono dati sintetici e
      # monkeypatch. Il golden master di tests/test_simulator_golden.py e' quello che
      # tiene fermo il simulatore, che non ha altri test.
      - name: pytest
        run: pytest -q

  docker:
    name: Build delle immagini
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: cryptofarm:runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Se il pacchetto e' installato male nell'immagine, questo lo dice subito e senza
      # scaricare i dati: importa i due moduli che contano e stampa dove finiranno i file.
      - name: Fumo sull'immagine
        run: |
          docker run --rm cryptofarm:runtime python -c "
          import cryptofarm.ml.trainer, cryptofarm.trading.simulator
          from cryptofarm.paths import MODELS_DIR, MARKET_DATA_DIR
          print('models     ->', MODELS_DIR)
          print('market_data->', MARKET_DATA_DIR)
          assert str(MODELS_DIR) == '/app/models', MODELS_DIR
          assert str(MARKET_DATA_DIR) == '/app/market_data', MARKET_DATA_DIR
          "

      - name: Build dev
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          push: false
          load: true
          tags: cryptofarm:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: I test dentro l'immagine
        run: docker run --rm cryptofarm:dev pytest -q

      # L'immagine che va in produzione e' l'ultimo stage del Dockerfile: si costruisce senza
      # `--target`, come fa Render, cosi' un giorno in cui l'ordine degli stage cambia la CI
      # se ne accorge invece di far spedire TensorFlow a un servizio da 512 MB.
      - name: Build web (stage di default, come lo costruisce Render)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cryptofarm:web
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # L'invariante da difendere: lo stage di default non deve essere `dl`, o al servizio da
      # 512 MB arriverebbero il giga e mezzo di TensorFlow. Se qualcuno riordina il file, qui
      # fallisce.
      - name: L'immagine di default non e' quella con TensorFlow
        run: |
          if docker run --rm cryptofarm:web python -c "import tensorflow" 2>/dev/null; then
            echo "TensorFlow e' nell'immagine di default: lo stage web non e' piu' l'ultimo" >&2
            exit 1
          fi
          docker run --rm cryptofarm:web python -c "import streamlit, plotly, sklearn; print('le dipendenze della pagina ci sono')"

      # Il contratto con Render: il servizio deve legarsi a $PORT su 0.0.0.0. Qui si verifica
      # davvero, avviando il container su una porta assegnata e interrogando la sonda.
      - name: Il servizio si lega a $PORT
        run: |
          docker run -d --name cryptofarm-web -e PORT=10000 -p 10000:10000 cryptofarm:web
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/_stcore/health >/dev/null 2>&1; then
              echo "pronto al tentativo $attempt"
              docker rm -f cryptofarm-web
              exit 0
            fi
            sleep 2
          done
          echo "il servizio non ha risposto su :10000 entro 60 s" >&2
          docker logs cryptofarm-web
          docker rm -f cryptofarm-web
          exit 1
